<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#020617"/>
  <circle cx="1050" cy="180" r="190" fill="#14b8a6" opacity="0.25" filter="blur(50px)"/>
  <g transform="translate(100, 130)">
    <text x="0" y="40" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="48" fill="#ffffff" filter="url(#shadow)">🧘 🧘 ZenFlow Yoga</text>
    <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="22" fill="#cbd5e1">Nền Tảng Dịch Vụ Thông Minh &amp; Đặt Lịch Trực Tuyến</text>
    <rect x="0" y="130" width="220" height="48" rx="24" fill="#14b8a6"/>
    <text x="110" y="161" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">Khám Phá Dịch Vụ</text>
  </g>
  <g transform="translate(840, 80)" filter="url(#shadow)">
    <rect width="260" height="240" rx="18" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <text x="130" y="60" font-size="44" text-anchor="middle">🧘</text>
    <text x="130" y="120" font-family="sans-serif" font-weight="bold" font-size="18" fill="#f8fafc" text-anchor="middle">Khóa Học Yoga Trị Liệu</text>
    <text x="130" y="150" font-family="sans-serif" font-weight="bold" font-size="20" fill="#14b8a6" text-anchor="middle">600.000đ / tháng</text>
    <rect x="30" y="180" width="200" height="36" rx="18" fill="#14b8a6"/>
    <text x="130" y="204" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Trải Nghiệm Ngay</text>
  </g>
</svg>